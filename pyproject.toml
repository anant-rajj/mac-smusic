[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-smusic"
version = "0.1.0"
description = "Precision multi-Mac synchronized audio and music streaming CLI engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Anant Raj", email = "anantraj.clcs@gmail.com" }
]
license = { text = "MIT" }
keywords = ["macos", "audio", "streaming", "synchronization", "cli", "coreaudio", "multicast", "sntp", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Swift",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
audio = [
    "av>=10.0.0",
]

[project.scripts]
mac-smusic = "mac_smusic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
